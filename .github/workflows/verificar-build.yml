name: Verificar build

on:
  push:
    branches: [cambios-contenido, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Versiones instaladas
        run: |
          versiones=$(for n in tinacms @tinacms/cli next react; do echo -n "$n@$(node -p "require('./node_modules/$n/package.json').version") "; done)
          echo "::notice title=versiones::$versiones"
      - name: Revisar tipos (todos los errores juntos)
        shell: bash
        run: |
          npx tinacms build --local --skip-indexing --skip-cloud-checks > /dev/null 2>&1 || true
          npx tsc --noEmit --pretty false > tsc.log 2>&1 && echo "::notice title=tipos::sin errores" || {
            resumen=$(head -80 tsc.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=tipos::$resumen"
          }
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            resumen=$(grep -v "^\s*$" build.log | tail -60 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=build::$resumen"
            exit 1
          }
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      - name: Probar páginas
        shell: bash
        run: |
          bash scripts/probar-paginas.sh > pruebas.log 2>&1 || true
          resumen=$(sed -e 's/%/%25/g' pruebas.log | awk '{printf "%s%%0A", $0}')
          if grep -q "FALLAS=0" pruebas.log; then echo "::notice title=pruebas::$resumen"; else echo "::error title=pruebas::$resumen"; exit 1; fi
      - name: Subir tina-lock.json actualizado
        if: success()
        shell: bash
        run: |
          if [ -n "$(git status --porcelain tina/tina-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tina/tina-lock.json
            git commit -m "Actualizar tina-lock.json [skip ci]"
            git push
            echo "::notice title=tina-lock::actualizado"
          else
            echo "::notice title=tina-lock::sin cambios"
          fi
      - name: Guardar package-lock actualizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
